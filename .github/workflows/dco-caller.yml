name: Dependabot Coverage Upload

on:
  issue_comment:
    types: [created]

# PoC-org workaround: PDFtoMark disallows write default GITHUB_TOKEN permissions.
# Adobe's org default grants read/write, so the target caller needs no block.
permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.issue.pull_request != null && github.event.comment.body == '/upload-coverage'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Gate check
        id: gate
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_USER_LOGIN/permission" --jq '.permission' 2>/dev/null || echo "none")
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then
            echo "allowed=true" >> $GITHUB_OUTPUT
          else
            echo "allowed=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}

  upload:
    needs: check
    if: needs.check.outputs.allowed == 'true'
    uses: ./.github/workflows/dco-reusable.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
