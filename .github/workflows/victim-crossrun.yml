name: victim-crossrun
# Mirrors adobe/aio-reusable-workflows/.github/workflows/dependabot-coverage-upload.yml@main
# (cross-run artifact fetch + codecov action), with only the artifact source untrusted.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: run id of the "attacker" CI run that produced coverage artifacts
        required: true
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Download coverage artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-report-ubuntu-latest-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Upload to Codecov
        if: steps.download.outcome == 'success'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/lcov.info'
          fail_ci_if_error: false
